name: Build and smoke test
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish server/Portlane.csproj -c Release -o /tmp/portlane
      - name: Verify sample scan and web entry point
        shell: bash
        run: |
          set -eu
          Frontend__Offline=true dotnet /tmp/portlane/Portlane.dll --urls http://127.0.0.1:5100 > /tmp/portlane.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true; cat /tmp/portlane.log' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:5100/ | grep Portlane
          curl -fsS -F file=@web/storefront.zip http://127.0.0.1:5100/api/scans | jq -e '.scan.files == 4 and (.scan.findings | length == 6)'
          curl -fsS -F file=@web/frontend-example.zip http://127.0.0.1:5100/api/scans | jq -e '.scan.files == 3 and (.scan.findings | length == 9)'
          python3 tests/project-plans.py
