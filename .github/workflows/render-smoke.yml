name: Verify Render deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/render-smoke.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SITE: https://portlane.onrender.com
    steps:
      - name: Verify the React entry point and configured provider
        run: |
          curl --fail --silent --show-error --retry 4 --max-time 90 "$SITE/" -o /tmp/page
          grep -q '<title>Portlane' /tmp/page
          curl --fail --silent --show-error "$SITE/api/provider" | jq -e '.provider == "Groq"'
      - name: Download and scan the public sample
        run: |
          curl -fsS --retry 18 --retry-all-errors --retry-delay 6 --max-time 30 "$SITE/RetailDesk.zip" -o /tmp/RetailDesk.zip
          curl -fsS -F file=@/tmp/RetailDesk.zip "$SITE/api/scans" |
            jq -e '.scan.files == 31 and ([.scan.findings[].title] | index("Legacy jQuery size()") != null)'
      - uses: actions/checkout@v4
      - name: Check frontend detection
        run: |
          PORTLANE_TEST_URL="$SITE" python3 tests/project-plans.py --frontend-only
      - name: Verify the deployed review and dependency map
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "$SITE/review.js" | grep -q 'function compareScans'; then break; fi
            sleep 5
          done
          PORTLANE_TEST_URL="$SITE" python3 tests/project-plans.py --live --review-only
      - name: Test scan comparison and finding review in mobile Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright-core@1.57.0
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" node tests/upload-browser.cjs
