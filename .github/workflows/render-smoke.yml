name: Verify Render deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/render-smoke.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://portlane.onrender.com
    steps:
      - name: Verify the React entry point and configured provider
        run: |
          curl --fail --silent --show-error --retry 4 --max-time 90 "$SITE/" -o /tmp/page
          grep -q '<title>Portlane' /tmp/page
          curl --fail --silent --show-error "$SITE/api/provider" | jq -e '.provider == "Groq"'
      - name: Download and scan the public sample
        run: |
          curl --fail --silent --show-error "$SITE/storefront.zip" -o /tmp/storefront.zip
          curl --fail --silent --show-error -F file=@/tmp/storefront.zip "$SITE/api/scans" |
            jq -e '.scan.files == 4 and (.scan.findings | length == 6)'
      - uses: actions/checkout@v4
      - name: Scan the frontend fixture on the live deployment
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 6 --max-time 15 "$SITE/frontend-example.zip" -o /tmp/frontend.zip
          curl --fail --silent --show-error -F file=@/tmp/frontend.zip "$SITE/api/scans" |
            jq -e '.scan as $s | $s.files == 3 and ([$s.findings[].title] | index("Legacy jQuery size()") != null and index("Multiple Bootstrap versions referenced") != null) and all($s.findings[]; .upgrade.verify and .upgrade.guide)'
          PORTLANE_TEST_URL="$SITE" python3 tests/project-plans.py --frontend-only
      - name: Test ZIP selection in mobile Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright-core@1.57.0
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" node tests/upload-browser.cjs
